name: Windows Release Build

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger from Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history + tags for version detection

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows executable
        run: flutter build windows --release

      - name: Determine next version
        id: version
        shell: pwsh
        run: |
          # Find the highest semver tag matching v*.*.*
          $tags = git tag -l 'v*' | Where-Object { $_ -match '^v(\d+)\.(\d+)\.(\d+)$' }
          if ($tags) {
            $latest = $tags | Sort-Object {
              $_ -match '^v(\d+)\.(\d+)\.(\d+)$' | Out-Null
              [int]$Matches[1] * 10000 + [int]$Matches[2] * 100 + [int]$Matches[3]
            } | Select-Object -Last 1

            $latest -match '^v(\d+)\.(\d+)\.(\d+)$' | Out-Null
            $major = [int]$Matches[1]
            $minor = [int]$Matches[2]
            $patch = [int]$Matches[3] + 1
            $nextVersion = "$major.$minor.$patch"
          } else {
            $nextVersion = "1.0.0"
          }

          echo "Next version: $nextVersion"
          echo "version=$nextVersion" >> $env:GITHUB_OUTPUT

      - name: Package as ZIP
        id: package_info
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"

          $buildDir = "build\windows\x64\runner\Release"
          if (-not (Test-Path $buildDir)) {
            $buildDir = "build\windows\runner\Release"
          }
          $zipPath = "rev_system_identification-v$version-windows.zip"
          Compress-Archive -Path "$buildDir\*" -DestinationPath $zipPath
          echo "zip_path=$zipPath" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          files: ${{ steps.package_info.outputs.zip_path }}
          generate_release_notes: true
          make_latest: true
