name: Windows Release Build

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows executable
        run: flutter build windows --release

      - name: Read version and package as ZIP
        id: package_info
        shell: pwsh
        run: |
          $content = Get-Content pubspec.yaml -Raw
          if ($content -match 'version:\s+(\S+)') {
            $version = $matches[1].Split('+')[0]
            echo "version=$version" >> $env:GITHUB_OUTPUT
          }

          $buildDir = "build\windows\x64\runner\Release"
          if (-not (Test-Path $buildDir)) {
            $buildDir = "build\windows\runner\Release"
          }
          $zipPath = "rev_system_identification-v$version-windows.zip"
          Compress-Archive -Path "$buildDir\*" -DestinationPath $zipPath
          echo "zip_path=$zipPath" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package_info.outputs.version }}
          name: Release v${{ steps.package_info.outputs.version }}
          files: ${{ steps.package_info.outputs.zip_path }}
          generate_release_notes: true
          make_latest: true
